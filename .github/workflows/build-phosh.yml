name: Build patched phosh (PIN auto-submit for non-homed users)

# Phosh submits the PIN as soon as it reaches the PIN length -- but it only
# learns the length from systemd-homed user records, so on postmarketOS users
# it always shows the "Unlock" button. mods/phosh/ adds a fallback: the length
# from /etc/phosh/pin-length. libphosh is rebuilt too, which covers the phrog
# greeter's PIN pad.

on:
  workflow_dispatch:

permissions:
  contents: write

env:
  DEVICE: lenovo-lxf-p5100
  UI: phosh

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Host setup
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 openssl xz-utils zstd
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Install pmbootstrap
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Configure
        run: |
          yes "" | pmbootstrap init || true
          pmbootstrap config device "$DEVICE"
          pmbootstrap config ui "$UI"

      - name: Prepare patched phosh aport
        run: |
          set -euxo pipefail
          PMAPORTS="$(pmbootstrap config aports | tail -1)"
          # postmarketOS's systemd flavour carries its own phosh aport
          # (extra-repos/systemd), and that is what the image installs. Patch
          # that one in place; fall back to Alpine's community/phosh otherwise.
          DEST="$(find "$PMAPORTS" -path '*/phosh/APKBUILD' -not -path '*/temp/*' | head -1 | xargs -r dirname)"
          if [ -z "$DEST" ]; then
            git clone -q --depth 1 --filter=blob:none --sparse https://github.com/alpinelinux/aports.git aports
            (cd aports && git sparse-checkout set community/phosh)
            DEST="$PMAPORTS/temp/phosh"
            rm -rf "$DEST"; mkdir -p "$DEST"
            cp -r aports/community/phosh/. "$DEST/"
          fi
          rm -rf "$PMAPORTS/temp/phosh"  # make sure only one phosh aport exists
          [ -d "$DEST" ] || { echo "no phosh aport"; exit 1; }
          echo "Using aport: $DEST"; echo "$DEST" > /tmp/phosh-aport
          cp mods/phosh/0100-pin-length-fallback-file.patch "$DEST/"
          cd "$DEST"
          grep -E '^(pkgver|pkgrel)=' APKBUILD
          # Stay ahead of the archive's phosh so apk won't swap ours back.
          sed -i 's/^pkgrel=.*/pkgrel=100/' APKBUILD
          # LTO under emulation is very slow and buys little here.
          sed -i 's/-Db_lto=true/-Db_lto=false/' APKBUILD
          # Its test suite needs a full EGL/xvfb setup; not useful under emulation.
          echo 'options="$options !check"' >> APKBUILD
          python3 - <<'PY'
          import re
          p = "APKBUILD"
          s = open(p).read()
          m = re.search(r'^source="([^"]*)"', s, re.M)
          assert m, "no source= line"
          new = 'source="' + m.group(1).rstrip() + '\n\t0100-pin-length-fallback-file.patch\n\t"'
          s = s[:m.start()] + new + s[m.end():]
          open(p, "w").write(s)
          PY
          grep -n -A6 '^source=' APKBUILD
          grep -n "prepare()\|default_prepare" APKBUILD || echo "(no custom prepare: abuild's default applies *.patch)"
          pmbootstrap checksum phosh

      - name: Check the patch applies to this phosh release
        run: |
          set -euxo pipefail
          DEST="$(cat /tmp/phosh-aport)"
          VER="$(sed -n 's/^pkgver=//p' "$DEST/APKBUILD")"
          curl -fsSL -o /tmp/phosh.tar.xz "https://sources.phosh.mobi/releases/phosh/phosh-${VER}.tar.xz"
          mkdir -p /tmp/phoshsrc && tar xf /tmp/phosh.tar.xz -C /tmp/phoshsrc
          cd /tmp/phoshsrc/phosh-${VER}
          patch -p1 --dry-run < "$GITHUB_WORKSPACE/mods/phosh/0100-pin-length-fallback-file.patch"

      - name: Build phosh for armv7
        run: |
          pmbootstrap -y build --arch armv7 --force phosh

      - name: Collect package
        run: |
          set -eux
          mkdir -p out
          find ~/.local/var/pmbootstrap/packages -path '*armv7*' -name '*-r100.apk' \
            \( -name 'phosh-[0-9]*' -o -name 'libphosh-[0-9]*' -o -name 'phosh-schemas-[0-9]*' -o -name 'phosh-portalsconf-[0-9]*' -o -name 'phosh-systemd-[0-9]*' \) \
            -exec cp {} out/ \;
          ls -la out/
          test -n "$(ls out/*.apk)"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Show log tail on failure
        if: failure()
        run: tail -n 250 ~/.local/var/pmbootstrap/log.txt || true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="phosh-pinlen-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/* --title "phosh with PIN auto-submit fallback (armv7)" \
            --notes "Install on the tablet: sudo apk add --allow-untrusted ./*-r100.apk, then echo 6 | sudo tee /etc/phosh/pin-length && sudo systemctl restart greetd"
