name: Build patched gnome-software (32-bit ARM startup crash fix)

# GNOME Software 51.1 segfaults at startup on 32-bit ARM: GsAppQuery's
# dedupe-flags property collects a 32-bit flags value from varargs while every
# caller passes the 64-bit GsAppListFilterFlags enum. mods/gnome-software/
# makes the property a guint64, as gs-app-list.h already says it should be.
#
# Built with abuild inside an Alpine edge armv7 container (qemu), i.e. the
# same way Alpine builds its own package; pmbootstrap's build chroot pulls the
# systemd-flavoured polkit whose install scripts fail there.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - name: Enable armv7 emulation
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm

      - name: Get Alpine's gnome-software aport and add our patch
        run: |
          set -euxo pipefail
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/alpinelinux/aports.git aports
          (cd aports && git sparse-checkout set community/gnome-software)
          A=aports/community/gnome-software
          cp mods/gnome-software/0100-app-query-dedupe-flags-uint64.patch $A/
          sed -i 's/^pkgrel=.*/pkgrel=100/' $A/APKBUILD
          python3 - <<'PY'
          import re
          p = "aports/community/gnome-software/APKBUILD"
          s = open(p).read()
          m = re.search(r'^source="([^"]*)"', s, re.M)
          s = s[:m.start()] + 'source="' + m.group(1).rstrip() + '\n\t0100-app-query-dedupe-flags-uint64.patch\n\t"' + s[m.end():]
          s += '\noptions="$options !check"\n'
          open(p, "w").write(s)
          PY
          grep -E '^(pkgver|pkgrel)=' $A/APKBUILD
          grep -n -A12 '^source=' $A/APKBUILD

      - name: Build in Alpine edge armv7
        run: |
          set -eux
          mkdir -p out
          docker run --rm --platform linux/arm/v7 \
            -v "$PWD/aports/community/gnome-software:/src" -v "$PWD/out:/out" \
            alpine:edge sh -euxc '
              apk add --no-cache alpine-sdk sudo
              adduser -D b && addgroup b abuild && echo "b ALL=(ALL) NOPASSWD: ALL" > /etc/sudoers.d/b
              cp -r /src /home/b/gs && chown -R b:b /home/b/gs
              su b -c "abuild-keygen -a -n -i"
              cd /home/b/gs
              su b -c "abuild checksum && abuild -r"
              find /home/b -name "gnome-software*-r100.apk" -exec cp {} /out/ \;
            '
          ls -la out
          test -n "$(ls out/*.apk)"
          sha256sum out/*.apk | tee out/SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="gnome-software-arm32fix-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/* --title "GNOME Software with the 32-bit ARM startup crash fixed (armv7)" \
            --notes "Install on the tablet: sudo apk add --allow-untrusted ./gnome-software-51*-r100.apk (plus the -lang/-doc subpackages only if you want them)."
