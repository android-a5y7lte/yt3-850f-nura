name: Build Capyloon b2g shell (armv7/musl)

# Capyloon is the open Firefox OS / B2G descendant. Its Linux form factor is a
# GTK3 Wayland-only Gecko build with no Gonk: the tree ships the PinePhone
# recipe as mozconfig-b2g-mobian (aarch64, glibc). This does the same build one
# step further, armv7 + musl, so it runs on Nura (Alpine) on the YT3-850F as a
# second Wayland session next to Phosh.
#
# Facts from the recon run (gecko-b2g capyloon @ 01c46173, 2024-08-01):
#   - Gecko milestone 123.0, minimum Rust 1.70
#   - toolkit cairo-gtk3-wayland-only, lld, forkserver, api-daemon port 8081
# So the toolchain is pinned to that era (clang 17, Rust 1.76), the sysroot is
# Alpine v3.20 armv7 (gcc 13 headers, which clang 17 can parse; the binary then
# runs on newer musl/libstdc++), and Alpine's own firefox-123 musl patches are
# applied on top.
#
# Gecko is too big to compile under qemu, so this CROSS-compiles on the x86_64
# runner. sccache is saved even when the job runs out of time, so a second run
# picks up where the first one stopped.

on:
  workflow_dispatch:
    inputs:
      stage:
        description: "configure | build"
        default: build
        required: true
      branch:
        description: "gecko-b2g branch"
        default: capyloon
        required: true

permissions:
  contents: write

env:
  TARGET: armv7-alpine-linux-musleabihf
  RUST_TARGET: armv7-unknown-linux-musleabihf
  RUST_VERSION: "1.76.0"
  ALPINE_ARCH: armv7
  ALPINE_BRANCH: v3.20
  SCCACHE_DIR: /home/runner/.cache/sccache
  SCCACHE_CACHE_SIZE: 6G

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Runner size, free disk, swap
        run: |
          set -eux
          nproc; free -g
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          # libxul's link is memory hungry; give it swap so it cannot be OOM killed.
          sudo fallocate -l 10G /mnt/capy.swap && sudo chmod 600 /mnt/capy.swap
          sudo mkswap /mnt/capy.swap && sudo swapon /mnt/capy.swap
          free -g; df -h / /mnt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Host toolchain (clang 17, Rust 1.76, cbindgen, sccache)
        run: |
          set -eux
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang-17 lld-17 llvm-17 libclang-17-dev \
            sccache m4 pkg-config zip unzip xz-utils zstd curl ca-certificates patch
          # Unversioned names in one directory, first in PATH.
          sudo mkdir -p /opt/tc/bin
          for t in clang clang++ ld.lld lld llvm-ar llvm-ranlib llvm-nm llvm-strip llvm-objcopy llvm-objdump llvm-readelf llvm-profdata; do
            [ -x "/usr/bin/$t-17" ] && sudo ln -sf "/usr/bin/$t-17" "/opt/tc/bin/$t"
          done
          ls -la /opt/tc/bin
          echo "/opt/tc/bin" >> "$GITHUB_PATH"
          rustup toolchain install "$RUST_VERSION" --profile minimal
          rustup default "$RUST_VERSION"
          rustup target add "$RUST_TARGET"
          cargo install cbindgen --version 0.26.0 --locked
          rustc --version; cbindgen --version; sccache --version; node --version

      - name: Restore compile cache
        uses: actions/cache/restore@v4
        with:
          path: /home/runner/.cache/sccache
          key: capyloon-sccache-${{ github.run_id }}
          restore-keys: |
            capyloon-sccache-

      - name: Shallow clone gecko-b2g
        run: |
          set -eux
          git clone --depth 1 -b "${{ github.event.inputs.branch }}" https://github.com/capyloon/gecko-b2g gecko
          cd gecko
          echo "head: $(git rev-parse --short HEAD) $(git log -1 --format=%cd --date=short)"
          grep -v '^#' config/milestone.txt | grep .

      - name: Apply Alpine's firefox-123 musl patches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          # community/firefox as it was while it shipped 123.x (124 came 2024-03-19).
          SHA=$(gh api "repos/alpinelinux/aports/commits?path=community/firefox/APKBUILD&until=2024-03-15T00:00:00Z&per_page=1" --jq '.[0].sha')
          echo "aports commit: $SHA"
          mkdir aports && cd aports && git init -q
          git remote add origin https://github.com/alpinelinux/aports.git
          git sparse-checkout set community/firefox
          git fetch -q --depth 1 --filter=blob:none origin "$SHA"
          git checkout -q FETCH_HEAD
          grep -E '^(pkgver|arch)=' community/firefox/APKBUILD
          sed -n '/base-mozconfig/,/EOF/p' community/firefox/APKBUILD
          cd ../gecko
          for p in ../aports/community/firefox/*.patch; do
            n=$(basename "$p")
            case "$n" in
              # We use rustup's armv7-unknown-linux-musleabihf, not Alpine's triple.
              *rust-target*) echo "SKIP  $n"; continue ;;
              # for system ICU 74; we build the bundled ICU.
              icu74*) echo "SKIP  $n"; continue ;;
            esac
            if patch -p1 -N --dry-run -s < "$p" >/dev/null 2>&1; then
              patch -p1 -N -s < "$p" && echo "OK    $n"
            else
              echo "FAIL  $n (does not apply to this tree, left out)"
            fi
          done

      - name: Assemble Alpine armv7 (musl) sysroot
        run: |
          set -eux
          SYS="$PWD/sysroot"; mkdir -p "$SYS"
          CDN="https://dl-cdn.alpinelinux.org/alpine/${ALPINE_BRANCH}"
          AST=$(curl -s "$CDN/main/x86_64/" | grep -oE 'apk-tools-static-[0-9][^"]*\.apk' | sort -V | tail -1)
          curl -sSL "$CDN/main/x86_64/$AST" -o ast.apk
          mkdir ast && tar -xzf ast.apk -C ast 2>/dev/null
          APK="$PWD/ast/sbin/apk.static"
          sudo "$APK" --arch "$ALPINE_ARCH" -X "$CDN/main" -X "$CDN/community" -U --allow-untrusted \
            --no-scripts --root "$SYS" --initdb add \
            musl-dev gcc g++ linux-headers \
            gtk+3.0-dev glib-dev pango-dev cairo-dev gdk-pixbuf-dev at-spi2-core-dev \
            dbus-dev dbus-glib-dev fontconfig-dev freetype-dev \
            wayland-dev wayland-protocols libxkbcommon-dev mesa-dev libdrm-dev \
            pulseaudio-dev alsa-lib-dev pipewire-dev libffi-dev zlib-dev pixman-dev libevent-dev
          sudo chown -R "$(id -u):$(id -g)" "$SYS"
          du -sh "$SYS"
          ls "$SYS/usr/lib/gcc/"*/ || true
          echo "SYSROOT=$SYS" >> "$GITHUB_ENV"

      - name: Write armv7/musl mozconfig
        run: |
          set -eux
          # Gecko hands clang the normalised triple (armv7-linux-musleabihf), which
          # no longer matches Alpine's GCC directory, so name that directory.
          GCCDIR=$(ls -d "$SYSROOT"/usr/lib/gcc/armv7-alpine-linux-musleabihf/* | tail -1)
          test -f "$GCCDIR/crtbeginS.o"
          cat > gecko/mozconfig-b2g-yt3 <<EOF
          # mozconfig-b2g-mobian, retargeted: armv7 + musl, no LTO, no debug info.
          . \$topsrcdir/mozconfig-capyloon-env
          export TOOLCHAIN_PREFIX="llvm-"
          export CC="clang --gcc-install-dir=${GCCDIR} -mfpu=neon"
          export CXX="clang++ --gcc-install-dir=${GCCDIR} -mfpu=neon"
          export BINDGEN_CFLAGS="--gcc-install-dir=${GCCDIR}"
          export HOST_CC=clang
          export HOST_CXX=clang++
          export RUSTFLAGS="-C target-feature=-crt-static"
          # b2g code uses glibc-isms such as uint without including the header.
          export CXXFLAGS="-include sys/types.h"

          ac_add_options --target=${TARGET}
          ac_add_options --with-sysroot=${SYSROOT}
          ac_add_options --with-arch=armv7-a
          ac_add_options --with-fpu=neon
          ac_add_options --with-float-abi=hard
          ac_add_options --with-thumb=yes
          ac_add_options --with-libclang-path=/usr/lib/llvm-17/lib
          ac_add_options --enable-linker=lld
          ac_add_options --enable-application=b2g
          ac_add_options --with-app-basename=b2g
          ac_add_options --enable-default-toolkit=cairo-gtk3-wayland-only
          ac_add_options --enable-forkserver
          ac_add_options --disable-updater
          ac_add_options --with-api-daemon-port=8081
          export MOZILLA_OFFICIAL=1
          ac_add_options --disable-tests
          ac_add_options MOZ_TELEMETRY_REPORTING=
          ac_add_options --with-ccache=sccache
          ac_add_options --disable-debug
          ac_add_options --disable-debug-symbols
          ac_add_options --disable-crashreporter
          ac_add_options --disable-jemalloc
          ac_add_options --enable-system-pixman
          ac_add_options --with-system-libevent
          ac_add_options --disable-profiling
          ac_add_options --without-wasm-sandboxed-libraries
          ac_add_options --enable-safebrowsing
          mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-armv7
          mk_add_options AUTOCLOBBER=1
          EOF
          sed -i 's/^          //' gecko/mozconfig-b2g-yt3
          # Gecko's guess for the Rust target ignores musl and lands on
          # thumbv7neon-unknown-linux-gnueabihf. Pin the target's Rust triple.
          python3 - gecko/build/moz.configure/rust.configure "$RUST_TARGET" <<'PY'
          import sys
          p, t = sys.argv[1], sys.argv[2]
          s = open(p).read()
          old = "rustc_target = detect_rustc_target(\n        target, compiler_info, arm_target, rust_supported_targets\n    )"
          assert s.count(old) == 1, "rust_target_triple call not found"
          open(p, "w").write(s.replace(old, 'rustc_target = "%s"' % t))
          print("pinned rust target to", t)
          PY
          cat gecko/mozconfig-b2g-yt3

      - name: mach configure
        run: |
          set -ux
          cd gecko
          export MOZCONFIG="$PWD/mozconfig-b2g-yt3"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"; mkdir -p "$MOZBUILD_STATE_PATH"
          ./mach configure 2>&1 | tail -n 400
          rc=${PIPESTATUS[0]}
          if [ "$rc" != 0 ]; then
            echo "==== config.log tail ===="
            tail -n 150 obj-armv7/config.log 2>/dev/null || true
            exit "$rc"
          fi

      - name: mach build
        if: ${{ github.event.inputs.stage == 'build' }}
        run: |
          set -ux
          cd gecko
          export MOZCONFIG="$PWD/mozconfig-b2g-yt3"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"
          # Stop before the job limit so the compile cache below still gets saved.
          rc=0
          timeout 285m ./mach build --keep-going > ../build.log 2>&1 || rc=$?
          set +e
          sed -i "s#$GITHUB_WORKSPACE/##g" ../build.log
          wc -l ../build.log
          echo "======== FAILED TARGETS ========"
          grep -E 'gmake\[[0-9]\]: \*\*\* \[' ../build.log | grep -v 'Waiting for unfinished' | sed -E 's/^ *[0-9:.]+ //' | sort -u | cut -c1-300 | head -n 200
          echo "======== DISTINCT ERRORS ========"
          grep -E ' error: |error\[E[0-9]+\]|ld\.lld: error|could not compile' ../build.log | grep -v '<instantiation>' | sed -E 's/^ *[0-9:.]+ //' | sort | uniq -c | sort -rn | cut -c1-400 | head -n 400
          echo "======== ERRORS (with context) ========"
          grep -nE ' error: |error\[E[0-9]+\]|ld\.lld: error|could not compile' -A6 ../build.log | grep -v '<instantiation>' | cut -c1-400 | head -n 1200
          echo "======== LAST 150 LINES ========"
          tail -n 150 ../build.log | cut -c1-300
          sccache --show-stats | head -30 || true
          [ "$rc" = 124 ] && echo "BUILD TIMED OUT - rerun the workflow, the cache continues it"
          exit "$rc"

      - name: Save compile cache
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: /home/runner/.cache/sccache
          key: capyloon-sccache-${{ github.run_id }}

      - name: Package
        if: ${{ github.event.inputs.stage == 'build' }}
        run: |
          set -eux
          cd gecko
          export MOZCONFIG="$PWD/mozconfig-b2g-yt3"
          export MOZBUILD_STATE_PATH="$HOME/.mozbuild"
          ./mach package 2>&1 | tail -n 60 || true
          mkdir -p ../out
          find obj-armv7/dist -maxdepth 1 -name 'b2g-*.tar.*' -exec cp -v {} ../out/ \;
          if [ -z "$(ls ../out)" ]; then
            tar -C obj-armv7/dist -cJf ../out/b2g-123-armv7-musl.tar.xz b2g
          fi
          file obj-armv7/dist/bin/b2g || true
          llvm-readelf -d obj-armv7/dist/bin/libxul.so | grep NEEDED || true
          ls -la ../out

      - name: Publish release
        if: ${{ github.event.inputs.stage == 'build' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eux
          sha256sum out/* | tee out/SHA256SUMS.txt
          TAG="capyloon-b2g-armv7-$(date +%Y%m%d-%H%M)"
          gh release create "$TAG" out/* \
            --title "Capyloon b2g runtime, Gecko 123 (armv7/musl) $(date +%Y-%m-%d)" \
            --notes "Experimental Gecko b2g runtime for Nura on the YT3-850F. Runs as a second Wayland session next to Phosh."
