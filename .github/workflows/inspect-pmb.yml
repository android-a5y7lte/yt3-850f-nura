name: Inspect pmbootstrap apk.static handling
on: workflow_dispatch
jobs:
  i:
    runs-on: ubuntu-24.04
    steps:
      - run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git p
          cd p
          grep -rn "apk.static\|apk_static" pmb --include=*.py | grep -v "^pmb/.*test" | head -60
          echo ======; sed -n '1,400p' pmb/helpers/apk.py
