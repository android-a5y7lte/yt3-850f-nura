name: Build Nura edge (postmarketOS) for YT3-850F

on:
  workflow_dispatch:
    inputs:
      ui:
        description: "Interface (phosh, sxmo-de-sway, xfce4)"
        default: "phosh"
      device:
        description: "pmOS device package (qcom-msm8909 or lenovo-lxf-p5100)"
        default: "lenovo-lxf-p5100"
      release:
        description: "Publish a GitHub release with the images"
        type: boolean
        default: false
      mods:
        description: "Also build a second image with mods/ overlay (touch, USB, audio UCM)"
        type: boolean
        default: true
  push:
    branches: [main]
    paths: [".github/workflows/build.yml"]

permissions:
  contents: write

env:
  DEVICE: ${{ github.event.inputs.device || 'lenovo-lxf-p5100' }}
  UI: ${{ github.event.inputs.ui || 'phosh' }}
  PMOS_USER: user
  PMOS_PASSWORD: "147147"

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Host setup
        run: |
          df -h /
          sudo apt-get update -qq
          sudo apt-get install -y -qq git python3 openssl kpartx xz-utils zstd android-sdk-libsparse-utils
          # Ubuntu 24.04 blocks unprivileged user namespaces, which newer pmbootstrap uses
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          sudo sysctl -w kernel.unprivileged_userns_clone=1 || true

      - name: Install pmbootstrap
        run: |
          git clone --depth 1 https://gitlab.postmarketos.org/postmarketOS/pmbootstrap.git ~/pmbootstrap
          mkdir -p ~/.local/bin
          ln -s ~/pmbootstrap/pmbootstrap.py ~/.local/bin/pmbootstrap
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          ~/.local/bin/pmbootstrap --version

      - name: Configure
        run: |
          yes "" | pmbootstrap init || true
          pmbootstrap config device "$DEVICE"
          pmbootstrap config ui "$UI"
          pmbootstrap config user "$PMOS_USER"
          pmbootstrap config hostname yt3-850f
          pmbootstrap config extra_packages "device-${DEVICE}-nonfree-firmware,networkmanager,openssh-server,wlr-randr"
          pmbootstrap config
          echo "--- device package ---"
          PMAPORTS="$(pmbootstrap config aports | tail -1)"
          find "$PMAPORTS" -maxdepth 3 -type d -name "device-$DEVICE" -exec sh -c 'cat "$1/deviceinfo"; echo; cat "$1/APKBUILD"' _ {} \;

      - name: Build image
        run: |
          pmbootstrap -y install --password "$PMOS_PASSWORD" --no-sparse

      - name: Export
        run: |
          pmbootstrap export out-links
          ls -la out-links/
          echo "--- device trees for this tablet ---"
          ls out-links/dtbs/ | grep -i -E "lenovo|lxf" || echo "NO LENOVO DTB FOUND"
          ls out-links/dtbs/ | wc -l
          mkdir out
          for f in out-links/*; do
            case "$f" in
              *.img) cp -L "$f" "out/${DEVICE}.img" ;;
            esac
          done
          ls -la out/

      - name: Add the YT3-850 device tree (lxf-p5000)
        if: env.DEVICE == 'qcom-msm8909'
        run: |
          set -euo pipefail
          # The packaged kernel (6.12) ships the 10-inch Yoga Tab 3 device tree
          # (lxf-p5100) but not the 8-inch one (lxf-p5000). In the msm8916-mainline
          # kernel both tablets share one hardware description and differ only in
          # model/compatible, so derive the p5000 tree from the packaged p5100 one.
          # That keeps it matched to the kernel that is actually in the image.
          sudo apt-get install -y -qq device-tree-compiler
          LOOP="$(sudo losetup -f --show -P out/qcom-msm8909.img)"
          sudo fdisk -l "$LOOP"
          mkdir mnt
          sudo mount "${LOOP}p1" mnt
          echo "--- boot partition ---"
          sudo find mnt -maxdepth 2 | head -60
          sudo cat mnt/extlinux/extlinux.conf || true
          REFDTB="$(sudo find mnt -name 'qcom-msm8909-lenovo-lxf-p5100.dtb' | head -1)"
          test -n "$REFDTB"
          DTBDIR="$(dirname "$REFDTB")"
          sudo cat "$REFDTB" > p5100.dtb
          dtc -q -I dtb -O dts -o p5100.dts p5100.dtb
          grep -n -E 'model = |compatible = "lenovo' p5100.dts
          sed -e 's/model = "Lenovo Yoga Tab 3 10 LTE";/model = "Lenovo Yoga Tab 3 8";/' \
              -e 's/lenovo,lxf-p5100/lenovo,lxf-p5000/' \
              p5100.dts > p5000.dts
          grep -q 'lenovo,lxf-p5000' p5000.dts
          dtc -q -I dts -O dtb -o qcom-msm8909-lenovo-lxf-p5000.dtb p5000.dts
          fdtget qcom-msm8909-lenovo-lxf-p5000.dtb / model
          fdtget qcom-msm8909-lenovo-lxf-p5000.dtb / compatible
          fdtget qcom-msm8909-lenovo-lxf-p5000.dtb /chosen/framebuffer@83200000 width
          fdtget qcom-msm8909-lenovo-lxf-p5000.dtb /chosen/framebuffer@83200000 height
          # extlinux.conf uses "fdtdir /", so the tree must sit next to every p5100 copy
          sudo find mnt -name 'qcom-msm8909-lenovo-lxf-p5100.dtb' | while read -r f; do
            sudo cp qcom-msm8909-lenovo-lxf-p5000.dtb "$(dirname "$f")/"
          done
          sudo find mnt -name '*lenovo-lxf*' -exec ls -la {} +
          df -h mnt
          sudo umount mnt
          sudo losetup -d "$LOOP"
          cp qcom-msm8909-lenovo-lxf-p5000.dtb out/
          sha256sum out/* | tee out/SHA256SUMS.txt

      - name: Default to landscape orientation
        run: |
          set -euo pipefail
          # The YT3-850F panel is natively portrait (800x1280) but the tablet is
          # designed to be used in landscape, kickstand at the bottom. Rotate the
          # phoc output by 90 degrees so the home screen lands in landscape.
          LOOP="$(sudo losetup -f --show -P out/${DEVICE}.img)"
          sudo mkdir -p mnt1
          sudo mount "${LOOP}p1" mnt1
          if [ -f mnt1/extlinux/extlinux.conf ]; then
            sudo sed -i 's|^menu title .*|menu title Nura Edge, Linux 6.12.1|' mnt1/extlinux/extlinux.conf
            echo "--- updated extlinux.conf ---"
            sudo cat mnt1/extlinux/extlinux.conf
          fi
          sudo umount mnt1
          sudo mkdir -p mnt2
          # the rootfs is on partition 2
          sudo mount "${LOOP}p2" mnt2
          sudo find mnt2 -maxdepth 2 -name "phoc.ini" -o -name "phoc.d" | head
          sudo mkdir -p mnt2/etc/phosh/phoc.ini.d
          sudo tee mnt2/etc/phosh/phoc.ini.d/10-landscape.ini >/dev/null <<INI
          # Rotate the display 90 degrees so the kickstand sits at the bottom.
          # Change to 270 if the image ends up upside-down after first boot.
          [output:DSI-1]
          rotate = 90
          INI
          # Older phoc reads only /etc/phosh/phoc.ini, so also drop it there
          # if the config dir isn't picked up by this version.
          if [ ! -f mnt2/etc/phosh/phoc.ini ]; then
            sudo tee mnt2/etc/phosh/phoc.ini >/dev/null <<INI
          [output:DSI-1]
          rotate = 90
          INI
          fi
          sudo cat mnt2/etc/phosh/phoc.ini.d/10-landscape.ini
          sudo umount mnt2
          sudo losetup -d "$LOOP"

      - name: Build mods image (touch, USB, audio UCM)
        if: github.event.inputs.mods != 'false'
        run: |
          set -euo pipefail
          STABLE="out/${DEVICE}.img"
          MODS="out/${DEVICE}-mods.img"
          cp -L "$STABLE" "$MODS"
          LOOP="$(sudo losetup -f --show -P "$MODS")"
          # The packaged device tree leaves four of the six BLSP I2C buses
          # disabled, among them the ones with the SMB358 charger (0x57) and
          # the bq27500 fuel gauge (0x55). Switch them on in every boot DTB.
          sudo apt-get install -y -qq device-tree-compiler
          sudo mkdir -p mnt_boot
          sudo mount "${LOOP}p1" mnt_boot
          sudo find mnt_boot -name 'qcom-msm8909-lenovo-lxf-p*.dtb' | while read -r dtb; do
            for b in 78b6000 78b7000 78b8000 78ba000; do
              sudo fdtput -t s "$dtb" /soc@0/i2c@$b status okay
            done
            echo "$dtb: $(for b in 78b5000 78b6000 78b7000 78b8000 78b9000 78ba000; do printf '%s=%s ' $b "$(fdtget "$dtb" /soc@0/i2c@$b status)"; done)"
          done
          sudo umount mnt_boot
          sudo mkdir -p mnt_mods
          sudo mount "${LOOP}p2" mnt_mods
          echo "--- overlay: common ---"
          sudo cp -av mods/common/. mnt_mods/
          echo "--- overlay: audio ---"
          sudo cp -av mods/audio/. mnt_mods/
          # Make scripts executable (the Linux ext4 cp preserves +x from the repo,
          # but belt-and-braces for anything that was committed without it).
          sudo chmod +x mnt_mods/usr/local/bin/yt3-touch mnt_mods/usr/local/bin/yt3-find-spk-amp mnt_mods/usr/local/bin/yt3-find-camera mnt_mods/usr/local/bin/yt3-zram \
                        mnt_mods/usr/local/bin/yt3-usb-gadget \
                        mnt_mods/usr/local/bin/yt3-audio-diag \
                        mnt_mods/usr/local/bin/yt3-blank
          # Enable the services at boot (systemctl enable in the chroot would
          # work but we don't need the complexity; symlinks are what it writes).
          sudo mkdir -p mnt_mods/etc/systemd/system/multi-user.target.wants
          for svc in yt3-touch.service yt3-usb-gadget.service yt3-dnsmasq-usb.service yt3-cpu-perf.service yt3-blank.service yt3-zram.service; do
            sudo ln -sf /etc/systemd/system/$svc \
                mnt_mods/etc/systemd/system/multi-user.target.wants/$svc
          done
          # NetworkManager requires its system-connections to be 0600 root:root
          for nm in mnt_mods/etc/NetworkManager/system-connections/*.nmconnection; do
            [ -f "$nm" ] || continue
            sudo chown 0:0 "$nm"
            sudo chmod 600 "$nm"
          done
          # Prefer the YT3-850F UCM when the sound card appears, by making it the
          # default UCM search path. The card's name comes from the DT (sound
          # "model = yt3-850f"), so alsa-ucm2 will pick pmos/yt3-850f/yt3-850f.conf.
          echo "--- services enabled ---"
          sudo ls -la mnt_mods/etc/systemd/system/multi-user.target.wants/
          echo "--- UCM files in place ---"
          sudo ls -la mnt_mods/usr/share/alsa/ucm2/pmos/yt3-850f/ || true
          sudo umount mnt_mods
          sudo losetup -d "$LOOP"
          sha256sum "$MODS" | tee -a out/SHA256SUMS.txt

      - name: Fix image ownership (chown 1001 -> root, chmod / 755)
        run: |
          set -euo pipefail
          # The pmbootstrap user-namespace install maps "root inside the chroot"
          # to the runner's uid (1001) when writing to the loop-mounted ext4,
          # so files on the image come out owned by uid 1001 instead of uid 0.
          # On the device uid 1001 doesn't exist (real root is uid 0, user is
          # uid 10000) and sudo refuses to start ("/etc must be owned by root"),
          # which also wedges su and apk. Also some builds leave / with 555
          # permissions (read-only for everyone), which stops anything from
          # modifying the rootfs. Find every file whose owner is still 1001
          # and chown it to root; retarget /home/user to the device's user uid
          # if it was swept up; set / to 755.
          for IMG in out/${DEVICE}.img out/${DEVICE}-mods.img out/${DEVICE}-gpu.img; do
            [ -f "$IMG" ] || continue
            echo "=== Fixing $IMG ==="
            LOOP="$(sudo losetup -f --show -P "$IMG")"
            sudo mkdir -p fixmnt
            for P in 1 2; do
              sudo mount "${LOOP}p${P}" fixmnt
              echo "--- p${P} before: root dir + a few samples ---"
              sudo ls -ld fixmnt
              sudo find fixmnt -maxdepth 2 -uid 1001 | head -5 || true
              sudo find fixmnt -uid 1001  -exec chown 0 {} + 2>/dev/null || true
              sudo find fixmnt -gid 1001  -exec chgrp 0 {} + 2>/dev/null || true
              sudo chmod 755 fixmnt
              # Re-own /home/user to the device's user uid (10000) if present
              if [ -d fixmnt/home/user ]; then
                sudo chown -R 10000:10000 fixmnt/home/user
              fi
              # NetworkManager silently ignores any .nmconnection file that is
              # not mode 0600 root:root. The mods step chmods them but the gpu
              # step didn't, and a cp -av from the git checkout preserves 0644
              # and runner uid. Nail them here regardless of which image.
              if [ -d fixmnt/etc/NetworkManager/system-connections ]; then
                for nm in fixmnt/etc/NetworkManager/system-connections/*.nmconnection; do
                  [ -f "$nm" ] || continue
                  sudo chown 0:0 "$nm"
                  sudo chmod 600 "$nm"
                done
              fi
              echo "--- p${P} after ---"
              sudo ls -ld fixmnt
              sudo ls -la fixmnt | head -15
              sudo umount fixmnt
            done
            sudo losetup -d "$LOOP"
            sha256sum "$IMG" | tee -a out/SHA256SUMS.txt
          done

      - name: Fetch lk2nd for MSM8909
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir lk2nd
          gh release download --repo msm8916-mainline/lk2nd --pattern '*msm8909*' --dir lk2nd || true
          gh release view --repo msm8916-mainline/lk2nd --json tagName,assets --jq '.tagName, (.assets[].name)' || true
          ls -la lk2nd/
          echo "--- does this lk2nd release know the tablet? ---"
          TAG="$(gh release view --repo msm8916-mainline/lk2nd --json tagName --jq .tagName)"
          git clone -q --depth 1 --branch "$TAG" https://github.com/msm8916-mainline/lk2nd.git lk2nd-src
          grep -rn -i "lxf-p5000" lk2nd-src/lk2nd/device/dts/msm8909/ || echo "lk2nd release $TAG has NO lxf-p5000 entry"
          grep -n -i -B3 -A25 "lxf-p5000 {" lk2nd-src/lk2nd/device/dts/msm8909/apq8009-1gb-qrd-skue.dts || true
          strings lk2nd/lk2nd-msm8909.img | grep -i "lxf" || echo "no lxf string in lk2nd image"

      - name: Compress
        run: |
          cd out
          for f in *.img; do
            ls -la "$f"
            xz -T0 -3 "$f"
          done
          cp ../lk2nd/* . 2>/dev/null || true
          ls -la

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nura-edge-yt3-850f-${{ env.UI }}
          path: out/
          compression-level: 0

      - name: Upload pmbootstrap log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pmbootstrap-log
          path: |
            ~/.local/var/pmbootstrap/log.txt
          if-no-files-found: ignore

      - name: Show log tail on failure
        if: failure()
        run: tail -n 200 ~/.local/var/pmbootstrap/log.txt || true

      - name: Publish release
        if: github.event.inputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="nura-edge-$(date +%Y%m%d-%H%M)-${UI}"
          gh release create "$TAG" out/* --title "Nura edge for YT3-850F ($UI)" --notes "Untested build. See README for flashing steps."
