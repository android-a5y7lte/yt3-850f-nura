# Lenovo Yoga Tab 3 8: the panel is portrait (800x1280), the tablet is used
# in landscape with the kickstand at the bottom. The current kernel drives the
# display through simpledrm, whose connector is called "Unknown-1"; DSI-1 is
# listed for a future real DRM driver.
# Rotation values: normal, 90, 180, 270.

[output:Unknown-1]
rotate = 90

[output:DSI-1]
rotate = 90
