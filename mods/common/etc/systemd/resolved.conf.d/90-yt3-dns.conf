# Name lookups failed on flashed images ("bad address", apk "DNS: transient
# error"): systemd-resolved rejected the answers with "DNSSEC validation
# failed: no-signature" (the home router strips DNSSEC data). Turn DNSSEC
# validation off and send all lookups to public resolvers.
[Resolve]
DNS=1.1.1.1 8.8.8.8
FallbackDNS=9.9.9.9 1.0.0.1
Domains=~.
DNSSEC=no
LLMNR=no
