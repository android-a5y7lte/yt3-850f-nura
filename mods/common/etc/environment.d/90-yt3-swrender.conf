WLR_RENDERER=pixman
GSK_RENDERER=cairo
# simpledrm names the panel "Unknown-1", which phosh does not treat as built-in,
# so it never picks the raw backlight and hides the brightness slider. The
# fake-builtin flag only affects that backlight lookup (and test outputs WL-1/X11-1).
PHOSH_DEBUG=fake-builtin
