Syntax 3

# Lenovo Yoga Tab 3 8 (YT3-850F, lxf_p5x00), MSM8909 + PM8909 WCD codec via
# the LPASS bypass path. The two speaker amplifiers (AW8736) hang off the
# codec's headphone outputs HPH_L/HPH_R and are on from boot, so speakers and
# the headphone jack share one output. Volume is left to PipeWire (software).

SectionUseCase."HiFi" {
	File "/Lenovo/yt3-850f/HiFi.conf"
	Comment "Play HiFi quality Music"
}
