# Default (HiFi) profile. Mirrors the MSM8916-based pmOS UCM so WCD controls
# get set to the names on the Yoga Tab 3 8's sound card:
#   aplay -D hw:0 ...     -> internal speaker or headphones
#   arecord -D hw:0 ...   -> internal mic or headset mic
# Jack detection is done by the codec driver; routing is set here.

SectionVerb {
    Value {
        PlaybackPCM "hw:${CardId}"
        CapturePCM  "hw:${CardId}"
    }

    EnableSequence [
        cdev "hw:${CardId}"

        # Base clocks + bias (names from the msm8916-wcd-analog driver)
        cset "name='RX1 MIX1 INP1' RX1"
        cset "name='RX2 MIX1 INP1' RX2"
        cset "name='RDAC2 MUX' RX2"

        # Speaker path: default on. When headphones are plugged in, the
        # "SpeakerSwitch" verb below mutes this.
        cset "name='Speaker Boost Switch' 1"
        cset "name='RX3 Digital Volume' 128"
        cset "name='LINEOUT Volume' 100"

        # Headphone path: on; ignored by the codec while the speaker is active.
        cset "name='HPHL Volume' 94"
        cset "name='HPHR Volume' 94"
        cset "name='RX1 Digital Volume' 128"
        cset "name='RX2 Digital Volume' 128"

        # Microphone bias (internal handset mic on AMIC1)
        cset "name='MIC BIAS Internal1' 1"
        cset "name='ADC1 Volume' 8"
        cset "name='DEC1 Volume' 96"
    ]

    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='Speaker Boost Switch' 0"
        cset "name='HPHL Volume' 0"
        cset "name='HPHR Volume' 0"
    ]
}

SectionDevice."Speaker" {
    Comment "Internal speaker"

    ConflictingDevice [ "Headphones" ]

    Value {
        PlaybackChannels "2"
        PlaybackPriority 200
    }

    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='Speaker Boost Switch' 1"
        cset "name='RX3 Digital Volume' 128"
    ]

    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='Speaker Boost Switch' 0"
    ]
}

SectionDevice."Headphones" {
    Comment "Headphone jack"

    ConflictingDevice [ "Speaker" ]

    Value {
        PlaybackChannels "2"
        PlaybackPriority 300
        JackControl "Headphone Jack"
        JackHWMute "Speaker"
    }

    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='HPHL Volume' 94"
        cset "name='HPHR Volume' 94"
        cset "name='HPHL' 1"
        cset "name='HPHR' 1"
    ]

    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='HPHL' 0"
        cset "name='HPHR' 0"
    ]
}

SectionDevice."Mic" {
    Comment "Internal microphone"

    ConflictingDevice [ "Headset" ]

    Value {
        CaptureChannels "1"
        CapturePriority 100
    }

    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='MIC BIAS Internal1' 1"
        cset "name='ADC1 Volume' 8"
        cset "name='DEC1 Volume' 96"
    ]

    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='MIC BIAS Internal1' 0"
    ]
}

SectionDevice."Headset" {
    Comment "Headset microphone"

    ConflictingDevice [ "Mic" ]

    Value {
        CaptureChannels "1"
        CapturePriority 200
        JackControl "Headset Jack"
    }

    EnableSequence [
        cdev "hw:${CardId}"
        cset "name='MIC BIAS Internal2' 1"
        cset "name='ADC2 Volume' 8"
        cset "name='DEC2 Volume' 96"
    ]

    DisableSequence [
        cdev "hw:${CardId}"
        cset "name='MIC BIAS Internal2' 0"
    ]
}
